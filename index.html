<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Unplugged</title>
  <meta name="description" content="Tick every day you stay off your phone. Keep the chain alive." />
  <meta name="theme-color" content="#0b0a14" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Unplugged" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <style>
    :root {
      --bg: #0b0a14;
      --card: rgba(255, 255, 255, 0.045);
      --card-border: rgba(255, 255, 255, 0.08);
      --text: #f4f1ff;
      --muted: rgba(244, 241, 255, 0.55);
      --faint: rgba(244, 241, 255, 0.22);
      --flame-1: #ffb547;
      --flame-2: #ff6a3d;
      --flame-3: #ff3d7f;
      --flame: linear-gradient(135deg, var(--flame-1), var(--flame-2) 55%, var(--flame-3));
      --good: #7cf0b5;
      --radius: 24px;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      min-height: 100dvh;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Rounded", "SF Pro Display", "Segoe UI", Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
      overscroll-behavior-y: none;
      user-select: none;
      -webkit-user-select: none;
    }
    body::before {
      content: "";
      position: fixed; inset: 0;
      background:
        radial-gradient(60% 45% at 85% 0%, rgba(255, 106, 61, 0.22), transparent 70%),
        radial-gradient(55% 40% at 0% 25%, rgba(120, 80, 255, 0.20), transparent 70%),
        radial-gradient(70% 50% at 50% 110%, rgba(255, 61, 127, 0.14), transparent 70%);
      pointer-events: none;
      z-index: 0;
    }
    main {
      position: relative; z-index: 1;
      max-width: 480px;
      margin: 0 auto;
      padding: calc(env(safe-area-inset-top) + 20px) 16px calc(env(safe-area-inset-bottom) + 32px);
      display: flex; flex-direction: column; gap: 16px;
    }

    header { display: flex; align-items: flex-end; justify-content: space-between; padding: 4px 4px 0; }
    .brand { font-size: 28px; font-weight: 800; letter-spacing: -0.03em; }
    .brand span { background: var(--flame); -webkit-background-clip: text; background-clip: text; color: transparent; }
    .today-label { color: var(--muted); font-size: 14px; font-weight: 600; text-align: right; }

    .card {
      background: var(--card);
      border: 1px solid var(--card-border);
      border-radius: var(--radius);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
    }

    /* ---------- Hero ---------- */
    .hero { padding: 28px 20px 22px; text-align: center; overflow: hidden; position: relative; }
    .ring-wrap { position: relative; width: 220px; height: 220px; margin: 0 auto; }
    .ring-wrap svg.ring { width: 100%; height: 100%; transform: rotate(-90deg); overflow: visible; }
    .ring-track { stroke: rgba(255, 255, 255, 0.07); }
    .ring-glow { transition: stroke-dashoffset 900ms cubic-bezier(.2, .8, .2, 1); filter: blur(6px); }
    .ring-fill { transition: stroke-dashoffset 900ms cubic-bezier(.2, .8, .2, 1); }
    .ring-center { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
    .flame { width: 34px; height: 34px; margin-bottom: 2px; transition: transform 300ms, opacity 300ms, filter 300ms; }
    .flame.cold { filter: grayscale(1); opacity: 0.35; }
    .flame.alive { animation: flicker 2.4s ease-in-out infinite; transform-origin: 50% 90%; }
    @keyframes flicker {
      0%, 100% { transform: scale(1) rotate(0deg); }
      30% { transform: scale(1.06, 0.97) rotate(-2deg); }
      60% { transform: scale(0.97, 1.05) rotate(2deg); }
    }
    .streak-num {
      font-size: 76px; font-weight: 800; line-height: 1; letter-spacing: -0.05em;
      font-variant-numeric: tabular-nums;
      background: var(--flame); -webkit-background-clip: text; background-clip: text; color: transparent;
    }
    .streak-num.zero { background: none; color: var(--faint); }
    .streak-label { font-size: 13px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); margin-top: 6px; }
    .message { margin: 18px auto 4px; font-size: 17px; font-weight: 600; line-height: 1.35; max-width: 300px; min-height: 46px; }
    .next { color: var(--muted); font-size: 14px; }
    .next b { color: var(--text); }

    /* ---------- Tick button ---------- */
    .tick-btn {
      width: 100%;
      border: 0; cursor: pointer;
      padding: 20px 22px;
      border-radius: 22px;
      font: inherit; font-size: 18px; font-weight: 750; letter-spacing: -0.01em;
      color: #1a0b07;
      background: var(--flame);
      box-shadow: 0 10px 30px -8px rgba(255, 90, 60, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.35);
      display: flex; align-items: center; justify-content: center; gap: 12px;
      transition: transform 120ms ease, box-shadow 200ms, background 300ms, color 300ms;
    }
    .tick-btn:active { transform: scale(0.97); }
    .tick-btn .box {
      width: 28px; height: 28px; border-radius: 9px;
      border: 2.5px solid rgba(26, 11, 7, 0.7);
      display: grid; place-items: center;
    }
    .tick-btn .box svg { width: 18px; height: 18px; opacity: 0; transform: scale(0.4); transition: all 250ms cubic-bezier(.3, 1.6, .5, 1); }
    .tick-btn.done {
      background: rgba(124, 240, 181, 0.12);
      color: var(--good);
      box-shadow: inset 0 0 0 1.5px rgba(124, 240, 181, 0.45);
    }
    .tick-btn.done .box { border-color: var(--good); background: var(--good); }
    .tick-btn.done .box svg { opacity: 1; transform: scale(1); }
    .tick-btn.pop { animation: pop 450ms cubic-bezier(.3, 1.6, .5, 1); }
    @keyframes pop { 0% { transform: scale(0.94); } 60% { transform: scale(1.03); } 100% { transform: scale(1); } }
    .tick-sub { text-align: center; color: var(--muted); font-size: 13px; margin-top: -6px; }

    /* ---------- Stats ---------- */
    .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
    .stat { padding: 16px 12px; text-align: center; }
    .stat .v { font-size: 26px; font-weight: 800; letter-spacing: -0.03em; font-variant-numeric: tabular-nums; }
    .stat .k { font-size: 11px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); margin-top: 4px; }

    /* ---------- Calendar ---------- */
    .cal { padding: 18px 14px 16px; }
    .cal-head { display: flex; align-items: center; justify-content: space-between; padding: 0 6px 14px; }
    .cal-title { font-size: 18px; font-weight: 750; letter-spacing: -0.01em; }
    .cal-title small { color: var(--muted); font-weight: 600; margin-left: 6px; font-size: 14px; }
    .nav { display: flex; gap: 6px; }
    .nav button {
      width: 36px; height: 36px; border-radius: 12px; border: 0; cursor: pointer;
      background: rgba(255, 255, 255, 0.06); color: var(--text); font-size: 18px;
      display: grid; place-items: center;
    }
    .nav button:disabled { opacity: 0.25; cursor: default; }
    .nav button:active:not(:disabled) { background: rgba(255, 255, 255, 0.14); }
    .weekdays, .grid { display: grid; grid-template-columns: repeat(7, 1fr); }
    .weekdays div { text-align: center; font-size: 11px; font-weight: 700; color: var(--faint); letter-spacing: 0.06em; padding-bottom: 8px; }
    .grid { row-gap: 8px; }
    .day {
      position: relative; height: 42px;
      display: grid; place-items: center;
      font-size: 15px; font-weight: 650; font-variant-numeric: tabular-nums;
      color: var(--muted);
      cursor: pointer;
    }
    .day.empty, .day.future { cursor: default; }
    .day.future { color: var(--faint); opacity: 0.5; }
    .day .bg {
      position: absolute; top: 3px; bottom: 3px; left: 3px; right: 3px;
      border-radius: 14px;
      transition: background 250ms, left 250ms, right 250ms, border-radius 250ms;
    }
    .day span { position: relative; z-index: 1; }
    .day.on { color: #1a0b07; font-weight: 800; }
    .day.on .bg { background: var(--flame); background-size: 700% 100%; box-shadow: 0 4px 16px -6px rgba(255, 90, 60, 0.7); }
    /* contiguous ticks melt into one chain */
    .day.on.join-l .bg { left: -1px; border-top-left-radius: 0; border-bottom-left-radius: 0; }
    .day.on.join-r .bg { right: -1px; border-top-right-radius: 0; border-bottom-right-radius: 0; }
    .day.on.join-l.join-r .bg { box-shadow: none; }
    .day.today:not(.on) .bg { box-shadow: inset 0 0 0 2px rgba(255, 140, 80, 0.75); }
    .day.today:not(.on) { color: var(--text); }
    .day.missed { color: rgba(244, 241, 255, 0.35); }
    .day:not(.empty):not(.future):active .bg { transform: scale(0.9); }
    .day.bump .bg { animation: bump 380ms cubic-bezier(.3, 1.6, .5, 1); }
    @keyframes bump { 0% { transform: scale(0.6); } 100% { transform: scale(1); } }
    .cal-foot { text-align: center; color: var(--faint); font-size: 12px; padding-top: 12px; }

    /* ---------- Milestones ---------- */
    .ms { padding: 18px 16px; }
    .section-title { font-size: 18px; font-weight: 750; padding: 0 4px 14px; letter-spacing: -0.01em; }
    .badges { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
    .badge {
      aspect-ratio: 1; border-radius: 18px;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: rgba(255, 255, 255, 0.035);
      border: 1px dashed rgba(255, 255, 255, 0.1);
      color: var(--faint);
      transition: all 300ms;
    }
    .badge .n { font-size: 22px; font-weight: 800; letter-spacing: -0.03em; }
    .badge .u { font-size: 10px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; margin-top: 1px; }
    .badge.earned {
      border: 1px solid transparent;
      background: linear-gradient(var(--bg), var(--bg)) padding-box, var(--flame) border-box;
      color: var(--text);
      box-shadow: 0 6px 20px -10px rgba(255, 90, 60, 0.8);
    }
    .badge.earned .n { background: var(--flame); -webkit-background-clip: text; background-clip: text; color: transparent; }
    .badge.next { border-style: solid; border-color: rgba(255, 140, 80, 0.35); color: var(--muted); }

    /* ---------- Footer ---------- */
    .foot { display: flex; justify-content: center; gap: 18px; padding-top: 4px; }
    .foot button { background: none; border: 0; color: var(--faint); font: inherit; font-size: 13px; font-weight: 600; cursor: pointer; padding: 8px; }
    .install-hint { text-align: center; color: var(--faint); font-size: 12px; line-height: 1.5; padding: 0 20px; }

    /* ---------- Toast & confetti ---------- */
    #confetti { position: fixed; inset: 0; pointer-events: none; z-index: 50; }
    .toast {
      position: fixed; left: 50%; top: calc(env(safe-area-inset-top) + 16px);
      transform: translate(-50%, -140%);
      background: rgba(20, 16, 34, 0.92);
      border: 1px solid var(--card-border);
      backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
      color: var(--text); padding: 12px 18px; border-radius: 16px;
      font-weight: 700; font-size: 15px; z-index: 60;
      transition: transform 450ms cubic-bezier(.3, 1.4, .5, 1);
      max-width: calc(100% - 32px); text-align: center;
    }
    .toast.show { transform: translate(-50%, 0); }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <canvas id="confetti"></canvas>
  <div class="toast" id="toast"></div>

  <main>
    <header>
      <div class="brand">Un<span>plugged</span></div>
      <div class="today-label" id="todayLabel"></div>
    </header>

    <section class="card hero">
      <div class="ring-wrap">
        <svg class="ring" viewBox="0 0 220 220" aria-hidden="true">
          <defs>
            <linearGradient id="ringGrad" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stop-color="#ffb547" />
              <stop offset="55%" stop-color="#ff6a3d" />
              <stop offset="100%" stop-color="#ff3d7f" />
            </linearGradient>
          </defs>
          <circle class="ring-track" cx="110" cy="110" r="96" fill="none" stroke-width="14" />
          <circle class="ring-glow" id="ringGlow" cx="110" cy="110" r="96" fill="none" stroke="url(#ringGrad)" stroke-width="22" stroke-linecap="round" opacity="0.25" />
          <circle class="ring-fill" id="ringFill" cx="110" cy="110" r="96" fill="none" stroke="url(#ringGrad)" stroke-width="14" stroke-linecap="round" />
        </svg>
        <div class="ring-center">
          <svg class="flame" id="flame" viewBox="0 0 24 24" aria-hidden="true">
            <defs>
              <linearGradient id="flameGrad" x1="0" y1="1" x2="0" y2="0">
                <stop offset="0%" stop-color="#ff3d7f" />
                <stop offset="50%" stop-color="#ff6a3d" />
                <stop offset="100%" stop-color="#ffb547" />
              </linearGradient>
            </defs>
            <path fill="url(#flameGrad)" d="M12 2c.6 3.2-1.2 5-2.8 6.8C7.6 10.6 6 12.4 6 15a6 6 0 0 0 12 0c0-2.1-.9-3.7-2-5 .1 1.6-.5 2.8-1.6 3.4.3-3.6-1.2-8.3-2.4-11.4z" />
          </svg>
          <div class="streak-num" id="streakNum">0</div>
          <div class="streak-label" id="streakLabel">day streak</div>
        </div>
      </div>
      <p class="message" id="message"></p>
      <div class="next" id="nextMs"></div>
    </section>

    <button class="tick-btn" id="tickBtn" aria-pressed="false">
      <span class="box"><svg viewBox="0 0 24 24" fill="none" stroke="#0b0a14" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5" /></svg></span>
      <span id="tickText">I stayed off my phone today</span>
    </button>
    <div class="tick-sub" id="tickSub"></div>

    <section class="stats">
      <div class="card stat"><div class="v" id="statBest">0</div><div class="k">Best</div></div>
      <div class="card stat"><div class="v" id="statTotal">0</div><div class="k">Total days</div></div>
      <div class="card stat"><div class="v" id="statMonth">0%</div><div class="k">This month</div></div>
    </section>

    <section class="card cal">
      <div class="cal-head">
        <div class="cal-title" id="calTitle"></div>
        <div class="nav">
          <button id="prevMonth" aria-label="Previous month">‹</button>
          <button id="nextMonth" aria-label="Next month">›</button>
        </div>
      </div>
      <div class="weekdays"><div>M</div><div>T</div><div>W</div><div>T</div><div>F</div><div>S</div><div>S</div></div>
      <div class="grid" id="grid"></div>
      <div class="cal-foot">Tap any past day to tick or untick it</div>
    </section>

    <section class="card ms">
      <div class="section-title">Milestones</div>
      <div class="badges" id="badges"></div>
    </section>

    <div class="foot">
      <button id="exportBtn">Back up</button>
      <button id="importBtn">Restore</button>
      <input type="file" id="importFile" accept="application/json,.json" hidden />
    </div>
    <p class="install-hint" id="installHint">On iPhone: tap Share → “Add to Home Screen” to use Unplugged like an app.</p>
  </main>

  <script>
  (() => {
    const STORE_KEY = 'unplugged.v1';
    const MILESTONES = [3, 7, 14, 21, 30, 60, 100, 365];
    const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];

    // ---------- date helpers (local time, keyed as YYYY-MM-DD) ----------
    const pad = n => String(n).padStart(2, '0');
    const keyOf = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
    const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
    const today = () => { const d = new Date(); d.setHours(0, 0, 0, 0); return d; };

    // ---------- storage ----------
    function load() {
      try {
        const raw = JSON.parse(localStorage.getItem(STORE_KEY) || '{}');
        return new Set(Array.isArray(raw.days) ? raw.days : []);
      } catch { return new Set(); }
    }
    function save() {
      try { localStorage.setItem(STORE_KEY, JSON.stringify({ days: [...days].sort() })); } catch {}
    }
    if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});

    let days = load();
    let viewMonth = (() => { const t = today(); return new Date(t.getFullYear(), t.getMonth(), 1); })();

    // ---------- streak maths ----------
    function runEndingAt(d) {
      let n = 0;
      while (days.has(keyOf(d))) { n++; d = addDays(d, -1); }
      return n;
    }
    function currentStreak() {
      const t = today();
      if (days.has(keyOf(t))) return { n: runEndingAt(t), todayDone: true };
      return { n: runEndingAt(addDays(t, -1)), todayDone: false };
    }
    function bestStreak() {
      let best = 0;
      for (const k of days) {
        const [y, m, dd] = k.split('-').map(Number);
        const d = new Date(y, m - 1, dd);
        if (days.has(keyOf(addDays(d, -1)))) continue; // only count from run starts
        let n = 0, x = d;
        while (days.has(keyOf(x))) { n++; x = addDays(x, 1); }
        best = Math.max(best, n);
      }
      return best;
    }

    function messageFor(n, todayDone) {
      if (!todayDone && n > 0) return `Your ${n}-day chain is waiting. Tick today to make it ${n + 1}.`;
      if (n === 0) return 'Every great streak starts with a single day. Make today day one.';
      if (n === 1) return 'Day one, done. The hardest step is behind you.';
      if (n < 4) return 'Momentum is building. Don’t break the chain.';
      if (n < 7) return 'Almost a full week. You can feel the difference.';
      if (n < 14) return 'Over a week unplugged. You’re rewiring your habits.';
      if (n < 21) return 'Two weeks of presence. This is who you are now.';
      if (n < 30) return 'Three weeks — a habit is forming. Keep the fire going.';
      if (n < 60) return 'A month of real life. Truly remarkable.';
      if (n < 100) return 'Unstoppable. Look at that chain.';
      return 'Legendary. You’ve taken your time back.';
    }

    // ---------- rendering ----------
    const $ = id => document.getElementById(id);
    const CIRC = 2 * Math.PI * 96;

    function render() {
      const t = today();
      const { n, todayDone } = currentStreak();
      // the ring fills toward the next milestone and stays full on the day you reach one
      const nextMs = MILESTONES.find(m => m >= Math.max(n, 1)) || (Math.ceil(n / 100) * 100);
      const prevMs = [0, ...MILESTONES].filter(m => m < nextMs).pop();
      const pct = (n - prevMs) / (nextMs - prevMs);

      $('todayLabel').textContent = t.toLocaleDateString(undefined, { weekday: 'long', month: 'short', day: 'numeric' });
      $('streakNum').textContent = n;
      $('streakNum').classList.toggle('zero', n === 0);
      $('streakLabel').textContent = n === 1 ? 'day streak' : 'days streak';
      $('flame').classList.toggle('cold', n === 0);
      $('flame').classList.toggle('alive', n > 0 && todayDone);
      for (const id of ['ringFill', 'ringGlow']) {
        $(id).style.strokeDasharray = CIRC;
        $(id).style.strokeDashoffset = CIRC * (1 - Math.max(0.0001, pct));
        $(id).style.visibility = n === 0 ? 'hidden' : 'visible';
      }
      $('message').textContent = messageFor(n, todayDone);
      const left = nextMs - n;
      $('nextMs').innerHTML = left === 0
        ? `🏆 <b>${nextMs}-day</b> milestone reached`
        : `<b>${left}</b> more day${left === 1 ? '' : 's'} to your <b>${nextMs}-day</b> milestone`;

      const btn = $('tickBtn');
      btn.classList.toggle('done', todayDone);
      btn.setAttribute('aria-pressed', todayDone);
      $('tickText').textContent = todayDone ? 'Today is ticked — well done' : 'I stayed off my phone today';
      $('tickSub').textContent = todayDone ? 'Tap again if you need to undo' : '';

      $('statBest').textContent = Math.max(bestStreak(), n);
      $('statTotal').textContent = days.size;
      const monthStart = new Date(t.getFullYear(), t.getMonth(), 1);
      let ticked = 0;
      for (let d = monthStart; d <= t; d = addDays(d, 1)) if (days.has(keyOf(d))) ticked++;
      $('statMonth').textContent = Math.round((ticked / t.getDate()) * 100) + '%';

      renderCalendar();
      renderBadges(Math.max(bestStreak(), n), n);
    }

    function renderCalendar(bumpKey) {
      const t = today();
      const y = viewMonth.getFullYear(), m = viewMonth.getMonth();
      const first = new Date(y, m, 1);
      const daysInMonth = new Date(y, m + 1, 0).getDate();
      const offset = (first.getDay() + 6) % 7; // Monday-first
      let count = 0;

      const grid = $('grid');
      grid.innerHTML = '';
      for (let i = 0; i < offset; i++) {
        const e = document.createElement('div'); e.className = 'day empty'; grid.appendChild(e);
      }
      for (let dnum = 1; dnum <= daysInMonth; dnum++) {
        const d = new Date(y, m, dnum);
        const k = keyOf(d);
        const col = (offset + dnum - 1) % 7;
        const cell = document.createElement('div');
        cell.className = 'day';
        cell.dataset.key = k;
        cell.innerHTML = `<div class="bg"></div><span>${dnum}</span>`;
        if (d > t) cell.classList.add('future');
        else if (days.has(k)) {
          count++;
          cell.classList.add('on');
          if (col > 0 && dnum > 1 && days.has(keyOf(addDays(d, -1)))) cell.classList.add('join-l');
          if (col < 6 && dnum < daysInMonth && days.has(keyOf(addDays(d, 1)))) cell.classList.add('join-r');
          // shift the gradient across a run so a chain looks like one continuous flame
          cell.querySelector('.bg').style.backgroundPosition = `${(col / 6) * 100}% 50%`;
        } else if (d < t) cell.classList.add('missed');
        if (k === keyOf(t)) cell.classList.add('today');
        if (k === bumpKey) cell.classList.add('bump');
        grid.appendChild(cell);
      }
      $('calTitle').innerHTML = `${MONTHS[m]} <small>${y}${count ? ` · ${count} ✓` : ''}</small>`;
      $('nextMonth').disabled = y === t.getFullYear() && m === t.getMonth();
    }

    function renderBadges(best, current) {
      const nextUp = MILESTONES.find(m => m > best);
      $('badges').innerHTML = MILESTONES.map(m => {
        const cls = best >= m ? 'earned' : (m === nextUp ? 'next' : '');
        const label = m >= 365 ? ['1', 'year'] : [m, 'days'];
        return `<div class="badge ${cls}"><div class="n">${label[0]}</div><div class="u">${label[1]}</div></div>`;
      }).join('');
    }

    // ---------- interactions ----------
    function toggle(k) {
      const before = currentStreak().n;
      const bestBefore = bestStreak();
      const adding = !days.has(k);
      if (adding) days.add(k); else days.delete(k);
      save();
      render();
      renderCalendar(adding ? k : null);
      if (adding) {
        const after = currentStreak().n;
        const hit = MILESTONES.find(m => after >= m && before < m && bestBefore < m);
        if (hit) {
          confetti(220);
          toast(`🔥 ${hit >= 365 ? 'One year' : hit + ' days'} unplugged! Milestone unlocked.`);
        } else {
          confetti(70);
          if (k === keyOf(today())) toast(after > 1 ? `${after} days in a row. Keep going!` : 'Day one. Let’s go! ✨');
        }
      }
    }

    $('tickBtn').addEventListener('click', () => {
      const btn = $('tickBtn');
      btn.classList.remove('pop'); void btn.offsetWidth; btn.classList.add('pop');
      toggle(keyOf(today()));
    });
    $('grid').addEventListener('click', e => {
      const cell = e.target.closest('.day');
      if (!cell || cell.classList.contains('empty') || cell.classList.contains('future')) return;
      toggle(cell.dataset.key);
    });
    $('prevMonth').addEventListener('click', () => { viewMonth = new Date(viewMonth.getFullYear(), viewMonth.getMonth() - 1, 1); renderCalendar(); });
    $('nextMonth').addEventListener('click', () => { viewMonth = new Date(viewMonth.getFullYear(), viewMonth.getMonth() + 1, 1); renderCalendar(); });

    // swipe between months
    let sx = null;
    $('grid').addEventListener('touchstart', e => { sx = e.touches[0].clientX; }, { passive: true });
    $('grid').addEventListener('touchend', e => {
      if (sx === null) return;
      const dx = e.changedTouches[0].clientX - sx; sx = null;
      if (Math.abs(dx) < 50) return;
      (dx > 0 ? $('prevMonth') : $('nextMonth')).click();
    });

    // backup / restore
    $('exportBtn').addEventListener('click', async () => {
      const data = JSON.stringify({ app: 'unplugged', version: 1, days: [...days].sort() }, null, 2);
      const file = new File([data], `unplugged-backup-${keyOf(today())}.json`, { type: 'application/json' });
      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        try { await navigator.share({ files: [file], title: 'Unplugged backup' }); return; } catch (e) { if (e.name === 'AbortError') return; }
      }
      const a = document.createElement('a');
      a.href = URL.createObjectURL(file); a.download = file.name; a.click();
      setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    });
    $('importBtn').addEventListener('click', () => $('importFile').click());
    $('importFile').addEventListener('change', async e => {
      const f = e.target.files[0]; if (!f) return;
      try {
        const parsed = JSON.parse(await f.text());
        const list = (parsed.days || []).filter(k => /^\d{4}-\d{2}-\d{2}$/.test(k));
        list.forEach(k => days.add(k));
        save(); render();
        toast(`Restored ${list.length} days ✓`);
      } catch { toast('That file could not be read'); }
      e.target.value = '';
    });

    // hide install hint when already running from the home screen
    if (window.navigator.standalone || matchMedia('(display-mode: standalone)').matches) $('installHint').hidden = true;

    // refresh when the app comes back to the foreground on a new day
    let lastKey = keyOf(today());
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible' && keyOf(today()) !== lastKey) {
        lastKey = keyOf(today());
        viewMonth = new Date(today().getFullYear(), today().getMonth(), 1);
        render();
      }
    });

    // ---------- toast ----------
    let toastTimer;
    function toast(msg) {
      const el = $('toast');
      el.textContent = msg; el.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => el.classList.remove('show'), 2600);
    }

    // ---------- confetti ----------
    const cvs = $('confetti'), ctx = cvs.getContext('2d');
    let parts = [], raf = null;
    function sizeCanvas() {
      const dpr = window.devicePixelRatio || 1;
      cvs.width = innerWidth * dpr; cvs.height = innerHeight * dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    addEventListener('resize', sizeCanvas); sizeCanvas();
    function confetti(count) {
      if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
      const colors = ['#ffb547', '#ff6a3d', '#ff3d7f', '#b18cff', '#7cf0b5', '#fff3d6'];
      const r = $('tickBtn').getBoundingClientRect();
      const ox = r.left + r.width / 2, oy = r.top + r.height / 2;
      for (let i = 0; i < count; i++) {
        const a = -Math.PI / 2 + (Math.random() - 0.5) * Math.PI * 1.1;
        const v = 6 + Math.random() * 9;
        parts.push({
          x: ox, y: oy, vx: Math.cos(a) * v, vy: Math.sin(a) * v,
          w: 5 + Math.random() * 6, h: 3 + Math.random() * 5,
          rot: Math.random() * Math.PI, vr: (Math.random() - 0.5) * 0.4,
          c: colors[(Math.random() * colors.length) | 0], life: 0,
        });
      }
      if (!raf) raf = requestAnimationFrame(step);
    }
    function step() {
      ctx.clearRect(0, 0, innerWidth, innerHeight);
      parts = parts.filter(p => p.life < 160 && p.y < innerHeight + 20);
      for (const p of parts) {
        p.life++; p.vy += 0.28; p.vx *= 0.985; p.vy *= 0.985;
        p.x += p.vx; p.y += p.vy; p.rot += p.vr;
        ctx.save();
        ctx.globalAlpha = Math.max(0, 1 - p.life / 160);
        ctx.translate(p.x, p.y); ctx.rotate(p.rot);
        ctx.fillStyle = p.c; ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
        ctx.restore();
      }
      raf = parts.length ? requestAnimationFrame(step) : (ctx.clearRect(0, 0, innerWidth, innerHeight), null);
    }

    render();

    if ('serviceWorker' in navigator && location.protocol !== 'file:') {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    }
  })();
  </script>
</body>
</html>
