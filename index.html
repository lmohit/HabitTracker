<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Unplugged</title>
  <meta name="description" content="Tick every day you keep your habits. Keep the chain alive." />
  <meta name="theme-color" content="#0e0f12" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Unplugged" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0e0f12;
      --surface: #17191e;
      --surface-2: #1b1e24;
      --border: #23262d;
      --track: #2a2d34;
      --text: #ecedef;
      --soft: #c9cbd1;
      --muted: #9a9ea8;
      --faint: #5c606a;
      --display: "Space Grotesk", -apple-system, system-ui, sans-serif;
      /* the habit on screen; overwritten from JS */
      --c: #a78bfa;
      --rgb: 167, 139, 250;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      min-height: 100dvh;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
      overscroll-behavior-y: none;
      user-select: none;
      -webkit-user-select: none;
    }
    button { font: inherit; color: inherit; cursor: pointer; }
    .view {
      max-width: 480px; margin: 0 auto;
      padding: calc(env(safe-area-inset-top) + 24px) 20px calc(env(safe-area-inset-bottom) + 28px);
      display: flex; flex-direction: column; gap: 20px;
    }
    .view[hidden] { display: none; }
    .view.enter { animation: enter 280ms cubic-bezier(.2, .9, .3, 1); }
    @keyframes enter { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
    .icon-btn {
      width: 44px; height: 44px; border-radius: 14px; flex: none;
      border: 1px solid var(--border); background: var(--surface);
      display: grid; place-items: center;
    }
    .icon-btn svg { width: 18px; height: 18px; }
    .icon-btn:active, .add-btn:active, .tick:active { transform: scale(0.92); }
    .card { border-radius: 20px; background: var(--surface); border: 1px solid var(--border); }
    .label { font-size: 12px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }

    /* ---------- Today ---------- */
    .top { display: flex; align-items: flex-end; justify-content: space-between; padding-top: 12px; }
    .date { font-size: 14px; font-weight: 500; color: var(--muted); margin-bottom: 6px; }
    .title { margin: 0; font-family: var(--display); font-size: 34px; font-weight: 700; letter-spacing: -0.02em; line-height: 1; }
    .add-btn {
      width: 48px; height: 48px; border-radius: 16px; border: 0;
      background: var(--text); color: var(--bg); display: grid; place-items: center;
    }
    .add-btn svg { width: 20px; height: 20px; }

    .summary { padding: 18px; display: flex; flex-direction: column; gap: 14px; }
    .summary-row { display: flex; align-items: center; gap: 16px; }
    .big-frac { font-family: var(--display); font-size: 44px; font-weight: 700; letter-spacing: -0.03em; line-height: 1; font-variant-numeric: tabular-nums; }
    .big-frac span { color: var(--faint); }
    .summary-text b { display: block; font-size: 15px; font-weight: 600; margin-bottom: 4px; }
    .summary-text small { font-size: 13px; color: var(--muted); }
    .segments { display: flex; gap: 6px; }
    .segments i { flex: 1; height: 6px; border-radius: 3px; background: rgba(var(--rgb), 0.2); transition: background 300ms; }
    .segments i.on { background: var(--c); }

    .list { display: flex; flex-direction: column; gap: 12px; }
    .hcard {
      padding: 16px 16px 18px; border-radius: 20px;
      display: flex; flex-direction: column; gap: 14px; cursor: pointer;
      background: linear-gradient(180deg, rgba(var(--rgb), 0.05), rgba(var(--rgb), 0.02)), var(--surface);
      border: 1px solid rgba(var(--rgb), 0.12);
      transition: background 300ms, border-color 300ms;
    }
    .hcard.done {
      background: linear-gradient(180deg, rgba(var(--rgb), 0.12), rgba(var(--rgb), 0.02)), var(--surface);
      border-color: rgba(var(--rgb), 0.35);
    }
    .hrow { display: flex; align-items: center; gap: 12px; }
    .hinfo { flex: 1; min-width: 0; }
    .hname { font-size: 16px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .hsub { font-size: 13px; color: var(--muted); margin-top: 2px; }
    .hnum { font-family: var(--display); font-size: 28px; font-weight: 700; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; color: var(--c); }
    .hnum.zero { color: var(--faint); }
    .tick {
      flex: none; width: 48px; height: 48px; border-radius: 16px;
      display: grid; place-items: center;
      background: rgba(var(--rgb), 0.08); border: 1.5px solid rgba(var(--rgb), 0.45);
      transition: background 200ms, box-shadow 200ms, transform 120ms;
    }
    .tick svg { width: 20px; height: 20px; stroke: var(--c); }
    .tick.on { background: var(--c); border-color: transparent; box-shadow: 0 6px 18px -6px rgba(var(--rgb), 0.7); }
    .tick.on svg { stroke: var(--bg); }
    .tick.pop { animation: pop 420ms cubic-bezier(.3, 1.6, .5, 1); }
    @keyframes pop { 0% { transform: scale(0.8); } 60% { transform: scale(1.08); } 100% { transform: scale(1); } }

    .chain { display: flex; align-items: center; }
    .chain .link { flex: 1; height: 2px; background: var(--track); }
    .chain .link.on { background: var(--c); }
    .chain .dot { flex: none; width: 12px; height: 12px; border-radius: 6px; background: var(--track); }
    .chain .dot.on { background: var(--c); }
    .chain .dot.pending { background: transparent; border: 1.5px dashed var(--c); }

    .foot { display: flex; justify-content: center; gap: 18px; }
    .foot button { background: none; border: 0; color: var(--muted); font-size: 13px; font-weight: 600; padding: 10px; }
    .hint { text-align: center; color: var(--faint); font-size: 12px; line-height: 1.5; margin: -8px 20px 0; }

    /* ---------- Habit detail ---------- */
    #detail { background: radial-gradient(120% 360px at 20% 0%, rgba(var(--rgb), 0.16), rgba(var(--rgb), 0) 70%); min-height: 100dvh; max-width: none; }
    #detail > * { width: 100%; max-width: 440px; margin-left: auto; margin-right: auto; }
    .bar { display: flex; justify-content: space-between; }
    .d-name { display: flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 600; color: var(--soft); margin-bottom: 4px; }
    .d-name i { width: 10px; height: 10px; border-radius: 5px; background: var(--c); box-shadow: 0 0 10px var(--c); flex: none; }
    .d-name span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .d-hero { display: flex; align-items: baseline; gap: 10px; }
    .d-num { font-family: var(--display); font-size: 112px; font-weight: 700; line-height: 0.95; letter-spacing: -0.05em; color: var(--c); font-variant-numeric: tabular-nums; }
    .d-num.zero { color: var(--faint); }
    .d-unit { font-family: var(--display); font-size: 22px; font-weight: 500; }
    .d-msg { font-size: 15px; color: var(--muted); margin-top: 8px; line-height: 1.4; }
    .d-tick {
      height: 56px; border-radius: 18px; border: 1.5px solid rgba(var(--rgb), 0.45);
      background: rgba(var(--rgb), 0.08); color: var(--c);
      font-size: 17px; font-weight: 700;
      display: flex; align-items: center; justify-content: center; gap: 10px;
      transition: background 200ms, color 200ms, transform 120ms;
    }
    .d-tick svg { width: 20px; height: 20px; }
    .d-tick.on { background: var(--c); color: var(--bg); border-color: transparent; box-shadow: 0 10px 24px -10px rgba(var(--rgb), 0.8); }
    .d-tick:active { transform: scale(0.98); }
    .stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
    .stat { padding: 14px; border-radius: 16px; background: var(--surface); border: 1px solid var(--border); }
    .stat b { display: block; font-family: var(--display); font-size: 24px; font-weight: 700; font-variant-numeric: tabular-nums; }
    .stat span { font-size: 12px; color: var(--muted); }
    .panel { padding: 16px; display: flex; flex-direction: column; gap: 12px; }
    .panel-head { display: flex; justify-content: space-between; align-items: center; }
    .panel-head b { font-size: 15px; font-weight: 600; }
    .panel-head span { font-size: 12px; color: var(--muted); }
    .heat { display: grid; grid-template-columns: repeat(18, minmax(0, 1fr)); grid-template-rows: repeat(7, 14px); grid-auto-flow: column; gap: 4px; }
    .heat i { border-radius: 3px; background: var(--track); }
    .heat i.on { background: var(--c); }
    .heat i.future { background: transparent; box-shadow: inset 0 0 0 1px var(--border); }
    .heat i.today { box-shadow: 0 0 0 2px var(--surface), 0 0 0 3px var(--c); }
    .legend { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); }
    .legend i { width: 10px; height: 10px; border-radius: 3px; background: var(--track); }
    .legend i.on { background: var(--c); margin-left: 10px; }

    .milestones { display: flex; flex-direction: column; gap: 12px; }
    .ms-title { font-size: 15px; font-weight: 600; }
    .ms { display: flex; align-items: center; }
    .ms .seg { flex: 1; height: 3px; }
    .ms .m {
      flex: none; width: 40px; height: 40px; border-radius: 20px;
      display: grid; place-items: center;
      font-family: var(--display); font-size: 14px; font-weight: 700;
      border: 1.5px solid #34373f; color: var(--muted);
    }
    .ms .m.got { background: var(--c); color: var(--bg); border-color: transparent; }
    .ms .m.next { border: 2px solid var(--c); color: var(--c); }

    .cal-nav { display: flex; gap: 6px; }
    .cal-nav button { width: 36px; height: 36px; border-radius: 12px; border: 0; background: var(--surface-2); display: grid; place-items: center; }
    .cal-nav button:disabled { opacity: 0.3; }
    .cal-nav svg { width: 16px; height: 16px; }
    .weekdays, .grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); }
    .weekdays div { text-align: center; font-size: 11px; font-weight: 600; color: var(--muted); padding-bottom: 6px; }
    .grid { row-gap: 6px; }
    .day {
      position: relative; height: 40px; display: grid; place-items: center;
      background: none; border: 0; padding: 0;
      font-size: 14px; font-weight: 600; font-variant-numeric: tabular-nums; color: var(--muted);
    }
    .day .bg { position: absolute; inset: 3px; border-radius: 12px; }
    .day span { position: relative; }
    .day.future { color: var(--faint); }
    .day.on { color: var(--bg); font-weight: 700; }
    .day.on .bg { background: var(--c); }
    .day.on.l .bg { left: -1px; border-top-left-radius: 0; border-bottom-left-radius: 0; }
    .day.on.r .bg { right: -1px; border-top-right-radius: 0; border-bottom-right-radius: 0; }
    .day.today:not(.on) { color: var(--text); }
    .day.today:not(.on) .bg { box-shadow: inset 0 0 0 1.5px var(--c); }
    .day.bump .bg { animation: pop 380ms cubic-bezier(.3, 1.6, .5, 1); }
    .cal-foot { text-align: center; font-size: 12px; color: var(--faint); }

    /* ---------- New / edit habit sheet ---------- */
    .scrim { position: fixed; inset: 0; z-index: 40; background: rgba(4, 5, 7, 0.7); opacity: 0; pointer-events: none; transition: opacity 250ms; }
    .scrim.open { opacity: 1; pointer-events: auto; }
    .sheet {
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 41;
      max-width: 480px; margin: 0 auto; max-height: 92dvh; overflow-y: auto;
      padding: 10px 20px calc(env(safe-area-inset-bottom) + 24px);
      border-radius: 28px 28px 0 0; background: #15171c; border-top: 1px solid #262931;
      display: flex; flex-direction: column; gap: 20px;
      transform: translateY(105%); visibility: hidden;
      transition: transform 380ms cubic-bezier(.2, .9, .3, 1), visibility 0s 380ms;
    }
    .sheet.open { transform: none; visibility: visible; transition-delay: 0s; }
    .grabber { width: 40px; height: 5px; border-radius: 3px; background: #34373f; align-self: center; flex: none; }
    .sheet-head { display: flex; justify-content: space-between; align-items: center; }
    .sheet-head h2 { margin: 0; font-family: var(--display); font-size: 26px; font-weight: 700; letter-spacing: -0.02em; }
    .sheet-head .icon-btn { background: transparent; border-color: #262931; color: var(--muted); }
    .field { display: flex; flex-direction: column; gap: 8px; }
    .name-input {
      height: 52px; padding: 0 16px; border-radius: 16px;
      border: 1.5px solid #262931; background: var(--bg); color: var(--text);
      font: 600 17px Inter, system-ui, sans-serif; outline: none;
      user-select: text; -webkit-user-select: text;
    }
    .name-input:focus { border-color: var(--c); }
    .ideas { display: flex; flex-wrap: wrap; gap: 8px; }
    .ideas[hidden] { display: none; }
    .ideas button { height: 36px; padding: 0 14px; border-radius: 18px; border: 1px solid #262931; background: var(--surface-2); color: var(--soft); font-size: 14px; font-weight: 500; }
    .ideas button:active { background: #262931; }
    .colors { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
    .colors button {
      height: 72px; border-radius: 16px; background: var(--surface-2); border: 1.5px solid transparent;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px;
      font-size: 12px; font-weight: 600; color: var(--soft);
    }
    .colors button i { width: 28px; height: 28px; border-radius: 14px; }
    .colors button.sel { background: #23262d; border-color: var(--sw); }
    .colors button.sel i { box-shadow: 0 0 14px var(--sw); }
    #preview .hcard { cursor: default; }
    .primary {
      flex: none; height: 56px; border-radius: 18px; border: 0; background: var(--c); color: var(--bg);
      font-size: 17px; font-weight: 700; box-shadow: 0 10px 24px -10px rgba(var(--rgb), 0.8);
    }
    .primary:disabled { opacity: 0.4; box-shadow: none; }
    .danger { background: none; border: 0; color: #ff8a80; font-size: 15px; font-weight: 600; padding: 6px; margin-top: -8px; }
    .danger[hidden] { display: none; }

    /* ---------- Toast & confetti ---------- */
    #confetti { position: fixed; inset: 0; pointer-events: none; z-index: 50; }
    .toast {
      position: fixed; left: 50%; top: calc(env(safe-area-inset-top) + 14px); z-index: 60;
      transform: translate(-50%, -160%);
      width: max-content; max-width: calc(100% - 32px); padding: 12px 18px; border-radius: 16px;
      background: rgba(27, 30, 36, 0.95); border: 1px solid rgba(var(--rgb), 0.4);
      font-size: 15px; font-weight: 600; text-align: center;
      backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
      visibility: hidden;
      transition: transform 420ms cubic-bezier(.3, 1.4, .5, 1), visibility 0s 420ms;
    }
    .toast.show { transform: translate(-50%, 0); visibility: visible; transition-delay: 0s; }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <canvas id="confetti"></canvas>
  <div class="toast" id="toast" role="status"></div>

  <!-- Today -->
  <main class="view" id="today">
    <header class="top">
      <div>
        <div class="date" id="dateLabel"></div>
        <h1 class="title">Today</h1>
      </div>
      <button class="add-btn" id="addBtn" aria-label="Add a habit">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14" /></svg>
      </button>
    </header>

    <section class="card summary">
      <div class="summary-row">
        <div class="big-frac" id="frac"></div>
        <div class="summary-text"><b id="sumTitle"></b><small id="sumSub"></small></div>
      </div>
      <div class="segments" id="segments"></div>
    </section>

    <section class="list" id="list"></section>

    <div class="foot">
      <button id="exportBtn">Back up</button>
      <button id="importBtn">Restore</button>
      <input type="file" id="importFile" accept="application/json,.json" hidden />
    </div>
    <p class="hint" id="installHint">On iPhone: tap Share → “Add to Home Screen” to use Unplugged like an app.</p>
  </main>

  <!-- Habit detail -->
  <main class="view" id="detail" hidden>
    <div class="bar">
      <button class="icon-btn" id="backBtn" aria-label="Back">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7" /></svg>
      </button>
      <button class="icon-btn" id="editBtn" aria-label="Edit habit">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9l-4-4L4 16v4z" /></svg>
      </button>
    </div>

    <section>
      <div class="d-name"><i></i><span id="dName"></span></div>
      <div class="d-hero"><div class="d-num" id="dNum">0</div><div class="d-unit">day chain</div></div>
      <div class="d-msg" id="dMsg"></div>
    </section>

    <button class="d-tick" id="dTick">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5" /></svg>
      <span id="dTickText"></span>
    </button>

    <section class="stats">
      <div class="stat"><b id="sBest">0</b><span>Longest chain</span></div>
      <div class="stat"><b id="sTotal">0</b><span>Days total</span></div>
      <div class="stat"><b id="sMonth">0%</b><span>This month</span></div>
    </section>

    <section class="card panel">
      <div class="panel-head"><b>Last 18 weeks</b><span id="heatRange"></span></div>
      <div class="heat" id="heat"></div>
      <div class="legend"><i></i>Missed <i class="on"></i>Ticked</div>
    </section>

    <section class="milestones">
      <div class="ms-title" id="msTitle"></div>
      <div class="ms" id="ms"></div>
    </section>

    <section class="card panel">
      <div class="panel-head">
        <b id="calTitle"></b>
        <div class="cal-nav">
          <button id="prevMonth" aria-label="Previous month"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7" /></svg></button>
          <button id="nextMonth" aria-label="Next month"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7" /></svg></button>
        </div>
      </div>
      <div>
        <div class="weekdays"><div>M</div><div>T</div><div>W</div><div>T</div><div>F</div><div>S</div><div>S</div></div>
        <div class="grid" id="grid"></div>
      </div>
      <div class="cal-foot">Tap a past day to tick or untick it</div>
    </section>
  </main>

  <!-- New / edit habit -->
  <div class="scrim" id="scrim"></div>
  <form class="sheet" id="sheet" autocomplete="off">
    <div class="grabber"></div>
    <div class="sheet-head">
      <h2 id="sheetTitle">New habit</h2>
      <button type="button" class="icon-btn" id="closeSheet" aria-label="Close">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18" /></svg>
      </button>
    </div>
    <div class="field">
      <label class="label" for="nameInput">Name</label>
      <input class="name-input" id="nameInput" maxlength="40" placeholder="What do you want to track?" />
      <div class="ideas" id="ideas"></div>
    </div>
    <div class="field">
      <div class="label">Colour</div>
      <div class="colors" id="colors"></div>
    </div>
    <div class="field">
      <div class="label">Preview</div>
      <div id="preview"></div>
    </div>
    <button type="submit" class="primary" id="saveBtn">Add habit</button>
    <button type="button" class="danger" id="deleteBtn">Delete habit</button>
  </form>

  <script>
  (() => {
    const STORE_KEY = 'unplugged.v2';
    const LEGACY_KEY = 'unplugged.v1';
    const MILESTONES = [3, 7, 14, 21, 30, 60, 100, 180, 365];
    const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
    const COLORS = {
      amber:  ['Amber',  '#F5A524'],
      coral:  ['Coral',  '#FF7A6B'],
      pink:   ['Pink',   '#F472B6'],
      violet: ['Violet', '#A78BFA'],
      sky:    ['Sky',    '#4CC2FF'],
      teal:   ['Teal',   '#2DD4BF'],
      mint:   ['Mint',   '#34D399'],
      lime:   ['Lime',   '#A3E635'],
    };
    // colour names used by the previous version of the app
    const OLD_THEMES = { ember: 'amber', ocean: 'sky', forest: 'mint', sunrise: 'coral', rose: 'pink' };
    const IDEAS = ['Read', 'Workout', 'Meditate', 'Journal', 'Walk 10k steps', 'Drink 2L water', 'Sleep by 11', 'No sugar', 'Stretch', 'No phone'];
    const WORDS = ['Zero', 'One', 'Two', 'Three', 'Four', 'Five', 'Six', 'Seven', 'Eight', 'Nine', 'Ten'];

    // ---------- helpers (local time, days keyed as YYYY-MM-DD) ----------
    const $ = id => document.getElementById(id);
    const pad = n => String(n).padStart(2, '0');
    const keyOf = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
    const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
    const today = () => { const d = new Date(); d.setHours(0, 0, 0, 0); return d; };
    const parseKey = k => { const [y, m, d] = k.split('-').map(Number); return new Date(y, m - 1, d); };
    const isDayKey = k => /^\d{4}-\d{2}-\d{2}$/.test(k);
    const uid = () => Math.random().toString(36).slice(2, 10);
    const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
    const hexRgb = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16)).join(', ');
    const colorVars = c => `--c:${COLORS[c][1]};--rgb:${hexRgb(COLORS[c][1])}`;
    const word = n => n <= 10 ? WORDS[n] : String(n);
    const plural = (n, w) => `${n} ${w}${n === 1 ? '' : 's'}`;
    const CHECK = '<svg viewBox="0 0 24 24" fill="none" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5" /></svg>';

    // ---------- storage ----------
    // habit: { id, name, color, created: YYYY-MM-DD, days: Set<YYYY-MM-DD> }
    function hydrate(h) {
      const days = new Set((h.days || []).filter(isDayKey));
      const color = COLORS[h.color] ? h.color : (OLD_THEMES[h.theme] || (COLORS[h.theme] ? h.theme : 'violet'));
      const created = isDayKey(h.created || '') ? h.created : ([...days].sort()[0] || keyOf(today()));
      return { id: String(h.id || uid()), name: String(h.name || 'Habit').slice(0, 40), color, created, days };
    }
    function load() {
      try {
        const raw = JSON.parse(localStorage.getItem(STORE_KEY) || 'null');
        if (raw && Array.isArray(raw.habits) && raw.habits.length) return raw.habits.map(hydrate);
      } catch {}
      // first run, or upgrading from the single-habit version
      let legacy = [];
      try { legacy = JSON.parse(localStorage.getItem(LEGACY_KEY) || '{}').days || []; } catch {}
      return [hydrate({ name: 'No phone', color: 'violet', days: legacy })];
    }
    const serialize = () => ({
      version: 3,
      habits: habits.map(h => ({ id: h.id, name: h.name, color: h.color, created: h.created, days: [...h.days].sort() })),
    });
    function save() { try { localStorage.setItem(STORE_KEY, JSON.stringify(serialize())); } catch {} }
    if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});

    let habits = load();
    save();
    let detailId = null;
    let viewMonth = null;
    const find = id => habits.find(h => h.id === id);

    // ---------- streak maths ----------
    function runEndingAt(days, d) { let n = 0; while (days.has(keyOf(d))) { n++; d = addDays(d, -1); } return n; }
    function streak(h) {
      const t = today();
      const done = h.days.has(keyOf(t));
      return { n: runEndingAt(h.days, done ? t : addDays(t, -1)), done };
    }
    function longest(h) {
      let best = 0;
      for (const k of h.days) {
        const d = parseKey(k);
        if (h.days.has(keyOf(addDays(d, -1)))) continue; // only count from the start of each run
        let n = 0, x = d;
        while (h.days.has(keyOf(x))) { n++; x = addDays(x, 1); }
        best = Math.max(best, n);
      }
      return best;
    }
    // a perfect day: every habit that existed that day was ticked
    function isPerfect(d) {
      const k = keyOf(d);
      const live = habits.filter(h => h.created <= k);
      return live.length > 0 && live.every(h => h.days.has(k));
    }
    function perfectStreak() {
      const t = today();
      let d = isPerfect(t) ? t : addDays(t, -1), n = 0;
      while (n < 3650 && isPerfect(d)) { n++; d = addDays(d, -1); }
      return n;
    }

    // ---------- Today ----------
    function chainHtml(h, len = 14) {
      const t = today();
      let out = '';
      for (let i = len - 1; i >= 0; i--) {
        const d = addDays(t, -i);
        const on = h.days.has(keyOf(d));
        if (i < len - 1) out += `<i class="link ${on && h.days.has(keyOf(addDays(d, -1))) ? 'on' : ''}"></i>`;
        out += `<i class="dot ${on ? 'on' : (i === 0 ? 'pending' : '')}"></i>`;
      }
      return `<div class="chain" aria-hidden="true">${out}</div>`;
    }
    function cardHtml(h, opts = {}) {
      const { n, done } = streak(h);
      const sub = done ? 'Done today' : (n ? 'Keep the chain going' : 'Start a new chain');
      return `<article class="hcard ${done ? 'done' : ''}" data-id="${h.id}" style="${colorVars(h.color)}">
        <div class="hrow">
          <div class="hinfo"><div class="hname">${esc(h.name)}</div><div class="hsub">${sub}</div></div>
          <div class="hnum ${n ? '' : 'zero'}">${n}</div>
          ${opts.preview ? '' : `<button class="tick ${done ? 'on' : ''}" data-tick="${h.id}" aria-pressed="${done}" aria-label="${done ? 'Untick' : 'Tick'} ${esc(h.name)} for today">${CHECK}</button>`}
        </div>
        ${chainHtml(h)}
      </article>`;
    }

    function renderToday(popId) {
      const t = today(), tk = keyOf(t);
      $('dateLabel').textContent = t.toLocaleDateString(undefined, { weekday: 'long', day: 'numeric', month: 'short' });
      const done = habits.filter(h => h.days.has(tk)).length;
      const left = habits.length - done;
      const ps = perfectStreak();
      $('frac').innerHTML = `${done}<span>/${habits.length}</span>`;
      $('sumTitle').textContent = left === 0 ? 'Perfect day. Every habit ticked.'
        : done === 0 ? `${word(left)} to tick today` : `${word(left)} to go for a perfect day`;
      $('sumSub').textContent = ps ? `Perfect-day streak: ${plural(ps, 'day')}` : 'Perfect days build a chain of their own';
      $('segments').innerHTML = habits.map(h => `<i class="${h.days.has(tk) ? 'on' : ''}" style="${colorVars(h.color)}"></i>`).join('');
      $('list').innerHTML = habits.map(h => cardHtml(h)).join('');
      if (popId) {
        const b = $('list').querySelector(`[data-tick="${popId}"]`);
        if (b) b.classList.add('pop');
      }
    }

    // ---------- Habit detail ----------
    function messageFor(n, done) {
      if (!done && n > 0) return `Your ${n}-day chain is waiting. Tick today to make it ${n + 1}.`;
      if (n === 0) return 'Every chain starts with one link. Make today day one.';
      if (n < 3) return 'The first links are the hardest. You’re doing it.';
      if (n < 7) return 'Momentum is building. Don’t break the chain.';
      if (n < 14) return 'Over a week strong. You’re rewiring your habits.';
      if (n < 30) return 'This is becoming who you are.';
      if (n < 100) return 'Unstoppable. Look at that chain.';
      return 'Legendary. This habit is part of you now.';
    }

    function renderDetail(bumpKey) {
      const h = find(detailId);
      if (!h) return;
      const t = today(), tk = keyOf(t);
      const { n, done } = streak(h);
      $('detail').setAttribute('style', colorVars(h.color));

      $('dName').textContent = h.name;
      $('dNum').textContent = n;
      $('dNum').classList.toggle('zero', n === 0);
      $('dMsg').textContent = messageFor(n, done);
      $('dTick').classList.toggle('on', done);
      $('dTick').setAttribute('aria-pressed', done);
      $('dTickText').textContent = done ? 'Done today' : 'Tick today';

      $('sBest').textContent = Math.max(longest(h), n);
      $('sTotal').textContent = h.days.size;
      let ticked = 0;
      for (let d = new Date(t.getFullYear(), t.getMonth(), 1); d <= t; d = addDays(d, 1)) if (h.days.has(keyOf(d))) ticked++;
      $('sMonth').textContent = Math.round((ticked / t.getDate()) * 100) + '%';

      // 18-week heatmap, Monday-first columns, ending with this week
      const monday = addDays(t, -((t.getDay() + 6) % 7));
      const start = addDays(monday, -17 * 7);
      let cells = '';
      for (let i = 0; i < 18 * 7; i++) {
        const d = addDays(start, i), k = keyOf(d);
        cells += `<i class="${d > t ? 'future' : (h.days.has(k) ? 'on' : '')}${k === tk ? ' today' : ''}"></i>`;
      }
      $('heat').innerHTML = cells;
      const short = d => d.toLocaleDateString(undefined, { month: 'short' });
      $('heatRange').textContent = `${short(start)} – ${short(t)}`;

      renderMilestones(n);
      renderCalendar(h, bumpKey);
    }

    function renderMilestones(n) {
      const nextIdx = MILESTONES.findIndex(m => m > n);
      const ni = nextIdx === -1 ? MILESTONES.length : nextIdx;
      const startIdx = Math.max(0, Math.min(ni - 2, MILESTONES.length - 5));
      const shown = MILESTONES.slice(startIdx, startIdx + 5);
      const next = MILESTONES[nextIdx];
      $('msTitle').textContent = nextIdx === -1 ? 'Every milestone reached'
        : `Next: ${next === 365 ? '1 year' : next + ' days'} · ${plural(next - n, 'day')} to go`;
      $('ms').innerHTML = shown.map((m, i) => {
        let seg = '';
        if (i > 0) {
          const prev = shown[i - 1];
          const pct = n >= m ? 100 : n <= prev ? 0 : Math.round(((n - prev) / (m - prev)) * 100);
          seg = `<i class="seg" style="background: linear-gradient(90deg, var(--c) ${pct}%, var(--track) ${pct}%)"></i>`;
        }
        const cls = n >= m ? 'got' : (m === next ? 'next' : '');
        return `${seg}<div class="m ${cls}">${m === 365 ? '1y' : m}</div>`;
      }).join('');
    }

    function renderCalendar(h, bumpKey) {
      const t = today();
      const y = viewMonth.getFullYear(), m = viewMonth.getMonth();
      const offset = (new Date(y, m, 1).getDay() + 6) % 7;
      const dim = new Date(y, m + 1, 0).getDate();
      let html = '';
      for (let i = 0; i < offset; i++) html += '<div class="day"></div>';
      for (let dn = 1; dn <= dim; dn++) {
        const d = new Date(y, m, dn), k = keyOf(d);
        const col = (offset + dn - 1) % 7;
        const cls = ['day'];
        if (d > t) cls.push('future');
        else if (h.days.has(k)) {
          cls.push('on');
          if (col > 0 && h.days.has(keyOf(addDays(d, -1)))) cls.push('l');
          if (col < 6 && dn < dim && h.days.has(keyOf(addDays(d, 1)))) cls.push('r');
        }
        if (k === keyOf(t)) cls.push('today');
        if (k === bumpKey) cls.push('bump');
        html += d > t
          ? `<div class="${cls.join(' ')}"><div class="bg"></div><span>${dn}</span></div>`
          : `<button class="${cls.join(' ')}" data-key="${k}" aria-pressed="${h.days.has(k)}" aria-label="${d.toLocaleDateString(undefined, { day: 'numeric', month: 'long' })}"><div class="bg"></div><span>${dn}</span></button>`;
      }
      $('grid').innerHTML = html;
      $('calTitle').textContent = `${MONTHS[m]} ${y}`;
      $('nextMonth').disabled = y === t.getFullYear() && m === t.getMonth();
    }

    // ---------- navigation ----------
    function show(view) {
      for (const id of ['today', 'detail']) {
        const el = $(id);
        el.hidden = id !== view;
        if (id === view) { el.classList.remove('enter'); void el.offsetWidth; el.classList.add('enter'); }
      }
      window.scrollTo(0, 0);
    }
    function openDetail(id, push = true) {
      detailId = id;
      const t = today();
      viewMonth = new Date(t.getFullYear(), t.getMonth(), 1);
      renderDetail();
      show('detail');
      if (push) history.pushState({ habit: id }, '');
    }
    function closeDetail() {
      detailId = null;
      renderToday();
      show('today');
    }
    window.addEventListener('popstate', e => {
      if (e.state && e.state.habit && find(e.state.habit)) openDetail(e.state.habit, false);
      else closeDetail();
    });
    $('backBtn').addEventListener('click', () => (history.state && history.state.habit ? history.back() : closeDetail()));

    // ---------- ticking ----------
    function toggle(h, k, origin) {
      const before = streak(h).n, bestBefore = longest(h);
      const wasPerfect = isPerfect(today());
      const adding = !h.days.has(k);
      if (adding) h.days.add(k); else h.days.delete(k);
      save();
      if (detailId) renderDetail(adding ? k : null); else renderToday(adding ? h.id : null);
      if (!adding) return;
      // the clicked element was re-rendered; aim the confetti at its replacement
      const anchor = detailId ? (k === keyOf(today()) ? $('dTick') : $('grid').querySelector(`[data-key="${k}"]`))
        : $('list').querySelector(`[data-tick="${h.id}"]`);
      const after = streak(h).n;
      const hit = MILESTONES.find(m => after >= m && before < m && bestBefore < m);
      const color = COLORS[h.color][1];
      if (hit) {
        confetti(anchor || origin, 220, color);
        toast(`${h.name}: ${hit === 365 ? 'one year' : hit + ' days'} in a row. Milestone unlocked!`, h.color);
      } else if (k === keyOf(today()) && habits.length > 1 && !wasPerfect && isPerfect(today())) {
        confetti(anchor || origin, 180, null);
        toast('Perfect day. Every habit ticked!', h.color);
      } else {
        confetti(anchor || origin, 60, color);
        if (k === keyOf(today())) toast(after > 1 ? `${h.name}: ${after} days in a row` : `${h.name}: day one. Let’s go!`, h.color);
      }
    }
    $('list').addEventListener('click', e => {
      const card = e.target.closest('.hcard');
      if (!card) return;
      const tickBtn = e.target.closest('.tick');
      if (tickBtn) toggle(find(card.dataset.id), keyOf(today()), tickBtn);
      else openDetail(card.dataset.id);
    });
    $('dTick').addEventListener('click', () => toggle(find(detailId), keyOf(today()), $('dTick')));
    $('grid').addEventListener('click', e => {
      const cell = e.target.closest('button.day');
      if (cell) toggle(find(detailId), cell.dataset.key, cell);
    });
    $('prevMonth').addEventListener('click', () => { viewMonth = new Date(viewMonth.getFullYear(), viewMonth.getMonth() - 1, 1); renderCalendar(find(detailId)); });
    $('nextMonth').addEventListener('click', () => { viewMonth = new Date(viewMonth.getFullYear(), viewMonth.getMonth() + 1, 1); renderCalendar(find(detailId)); });
    let sx = null;
    $('grid').addEventListener('touchstart', e => { sx = e.touches[0].clientX; }, { passive: true });
    $('grid').addEventListener('touchend', e => {
      if (sx === null) return;
      const dx = e.changedTouches[0].clientX - sx; sx = null;
      if (Math.abs(dx) < 50) return;
      const btn = dx > 0 ? $('prevMonth') : $('nextMonth');
      if (!btn.disabled) btn.click();
    });

    // ---------- new / edit habit ----------
    let editing = null;
    let draftColor = 'violet';

    function renderSheet() {
      $('sheet').setAttribute('style', colorVars(draftColor));
      const taken = new Set(habits.map(h => h.name.toLowerCase()));
      $('ideas').hidden = !!editing;
      $('ideas').innerHTML = editing ? '' : IDEAS.filter(i => !taken.has(i.toLowerCase())).slice(0, 6)
        .map(i => `<button type="button" data-idea="${esc(i)}">${esc(i)}</button>`).join('');
      $('colors').innerHTML = Object.entries(COLORS).map(([k, [name, hex]]) =>
        `<button type="button" data-color="${k}" class="${k === draftColor ? 'sel' : ''}" style="--sw:${hex}" aria-pressed="${k === draftColor}"><i style="background:${hex}"></i>${name}</button>`).join('');
      renderPreview();
    }
    function renderPreview() {
      const base = editing || { id: 'preview', days: new Set() };
      const name = $('nameInput').value.trim() || 'Your new habit';
      $('preview').innerHTML = cardHtml({ ...base, name, color: draftColor }, { preview: true });
      $('saveBtn').disabled = !$('nameInput').value.trim();
    }
    function openSheet(h) {
      editing = h;
      const used = new Set(habits.map(x => x.color));
      draftColor = h ? h.color : (Object.keys(COLORS).find(c => !used.has(c)) || 'violet');
      $('sheetTitle').textContent = h ? 'Edit habit' : 'New habit';
      $('saveBtn').textContent = h ? 'Save changes' : 'Add habit';
      $('nameInput').value = h ? h.name : '';
      $('deleteBtn').hidden = !h || habits.length < 2;
      renderSheet();
      $('sheet').scrollTop = 0;
      $('scrim').classList.add('open');
      $('sheet').classList.add('open');
    }
    function closeSheet() {
      $('nameInput').blur();
      $('scrim').classList.remove('open');
      $('sheet').classList.remove('open');
    }
    $('addBtn').addEventListener('click', () => openSheet(null));
    $('editBtn').addEventListener('click', () => openSheet(find(detailId)));
    $('scrim').addEventListener('click', closeSheet);
    $('closeSheet').addEventListener('click', closeSheet);
    $('nameInput').addEventListener('input', renderPreview);
    $('ideas').addEventListener('click', e => {
      const b = e.target.closest('[data-idea]'); if (!b) return;
      $('nameInput').value = b.dataset.idea;
      renderPreview();
    });
    $('colors').addEventListener('click', e => {
      const b = e.target.closest('[data-color]'); if (!b) return;
      draftColor = b.dataset.color;
      renderSheet();
    });
    $('sheet').addEventListener('submit', e => {
      e.preventDefault();
      const name = $('nameInput').value.trim().slice(0, 40);
      if (!name) return;
      if (editing) {
        Object.assign(editing, { name, color: draftColor });
        save(); closeSheet(); renderDetail();
      } else {
        habits.push({ id: uid(), name, color: draftColor, created: keyOf(today()), days: new Set() });
        save(); closeSheet(); renderToday();
        toast(`${name} added. Day one starts now.`, draftColor);
      }
    });
    $('deleteBtn').addEventListener('click', () => {
      const h = editing;
      if (!h || habits.length < 2) return;
      if (!confirm(`Delete “${h.name}” and its ${plural(h.days.size, 'ticked day')}? This can’t be undone.`)) return;
      habits = habits.filter(x => x.id !== h.id);
      save(); closeSheet();
      if (history.state && history.state.habit) history.back(); else closeDetail();
    });

    // ---------- backup / restore ----------
    $('exportBtn').addEventListener('click', async () => {
      const data = JSON.stringify({ app: 'unplugged', ...serialize() }, null, 2);
      const file = new File([data], `unplugged-backup-${keyOf(today())}.json`, { type: 'application/json' });
      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        try { await navigator.share({ files: [file], title: 'Unplugged backup' }); return; } catch (e) { if (e.name === 'AbortError') return; }
      }
      const a = document.createElement('a');
      a.href = URL.createObjectURL(file); a.download = file.name; a.click();
      setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    });
    $('importBtn').addEventListener('click', () => $('importFile').click());
    $('importFile').addEventListener('change', async e => {
      const f = e.target.files[0]; if (!f) return;
      try {
        const parsed = JSON.parse(await f.text());
        // v1 backups hold a single list of days for the phone habit
        const incoming = Array.isArray(parsed.habits) ? parsed.habits.map(hydrate)
          : [hydrate({ name: 'No phone', color: 'violet', days: parsed.days || [] })];
        let total = 0;
        for (const inc of incoming) {
          const match = find(inc.id) || habits.find(h => h.name.toLowerCase() === inc.name.toLowerCase());
          if (match) {
            inc.days.forEach(k => match.days.add(k));
            if (inc.created < match.created) match.created = inc.created;
          } else habits.push(inc);
          total += inc.days.size;
        }
        save(); renderToday();
        toast(`Restored ${plural(incoming.length, 'habit')} · ${plural(total, 'day')}`);
      } catch { toast('That file could not be read'); }
      e.target.value = '';
    });

    if (window.navigator.standalone || matchMedia('(display-mode: standalone)').matches) $('installHint').hidden = true;

    // refresh when the app comes back to the foreground on a new day
    let lastKey = keyOf(today());
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState !== 'visible' || keyOf(today()) === lastKey) return;
      lastKey = keyOf(today());
      if (detailId) { viewMonth = new Date(today().getFullYear(), today().getMonth(), 1); renderDetail(); }
      else renderToday();
    });

    // ---------- toast ----------
    let toastTimer;
    function toast(msg, color) {
      const el = $('toast');
      el.textContent = msg;
      el.setAttribute('style', color ? colorVars(color) : '');
      el.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => el.classList.remove('show'), 2600);
    }

    // ---------- confetti ----------
    const cvs = $('confetti'), ctx = cvs.getContext('2d');
    let parts = [], raf = null;
    function sizeCanvas() {
      const dpr = window.devicePixelRatio || 1;
      cvs.width = innerWidth * dpr; cvs.height = innerHeight * dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    addEventListener('resize', sizeCanvas); sizeCanvas();
    function confetti(origin, count, color) {
      if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
      // one habit's colour, or every colour for a perfect day
      const colors = color ? [color, color, color, '#ECEDEF'] : Object.values(COLORS).map(c => c[1]);
      const r = origin ? origin.getBoundingClientRect() : { left: innerWidth / 2, top: innerHeight / 2, width: 0, height: 0 };
      const ox = r.left + r.width / 2, oy = r.top + r.height / 2;
      for (let i = 0; i < count; i++) {
        const a = -Math.PI / 2 + (Math.random() - 0.5) * Math.PI * 1.2;
        const v = 4 + Math.random() * 9;
        parts.push({
          x: ox, y: oy, vx: Math.cos(a) * v, vy: Math.sin(a) * v,
          s: 3 + Math.random() * 5, round: Math.random() < 0.5,
          rot: Math.random() * Math.PI, vr: (Math.random() - 0.5) * 0.4,
          c: colors[(Math.random() * colors.length) | 0], life: 0,
        });
      }
      if (!raf) raf = requestAnimationFrame(step);
    }
    function step() {
      ctx.clearRect(0, 0, innerWidth, innerHeight);
      parts = parts.filter(p => p.life < 140 && p.y < innerHeight + 20);
      for (const p of parts) {
        p.life++; p.vy += 0.26; p.vx *= 0.985; p.vy *= 0.985;
        p.x += p.vx; p.y += p.vy; p.rot += p.vr;
        ctx.save();
        ctx.globalAlpha = Math.max(0, 1 - p.life / 140);
        ctx.translate(p.x, p.y); ctx.rotate(p.rot);
        ctx.fillStyle = p.c;
        if (p.round) { ctx.beginPath(); ctx.arc(0, 0, p.s / 2, 0, Math.PI * 2); ctx.fill(); }
        else ctx.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2);
        ctx.restore();
      }
      raf = parts.length ? requestAnimationFrame(step) : (ctx.clearRect(0, 0, innerWidth, innerHeight), null);
    }

    renderToday();
    history.replaceState(null, '');

    if ('serviceWorker' in navigator && location.protocol !== 'file:') {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    }
  })();
  </script>
</body>
</html>
